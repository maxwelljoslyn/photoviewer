<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
{% csrf_token %}
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0e0f12; color: #e8e8ea;
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 36px 0; overflow: auto; display: grid; place-items: center; }
  #stage img { display: block; image-rendering: auto; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; display: flex;
    align-items: center; gap: 1.2rem; padding: 0 1rem; background: #16171c;
    border-top: 1px solid #26282f; font-size: .82rem; }
  #bar .count { font-weight: 700; font-variant-numeric: tabular-nums; }
  #bar .zoom { color: #9aa0aa; font-variant-numeric: tabular-nums; }
  #bar .name { color: #7d818c; font-family: ui-monospace, monospace; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
  #bar .keys { margin-left: auto; color: #6b6f79; }
  #bar .keys b { color: #aab; font-weight: 600; }
  #flash { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);
    padding: .4rem 1rem; border-radius: 999px; font-weight: 700; opacity: 0;
    transition: opacity .12s; pointer-events: none; }
  #flash.good { background: #1f6b38; color: #d8ffe2; opacity: 1; }
  #flash.not_good { background: #7a2b30; color: #ffdede; opacity: 1; }
  #flash.maybe { background: #7a6320; color: #fff2cc; opacity: 1; }
  #flash.undo { background: #2e4a7a; color: #dde7ff; opacity: 1; }
  #done { position: absolute; inset: 0; display: none; place-items: center; text-align: center; }
  #done.show { display: grid; }
  #done a { color: #6ea8ff; }
  #exif { position: absolute; left: 8px; bottom: 44px; width: 340px; max-width: 46vw;
    background: rgba(18,19,24,.92); border: 1px solid #2b2d35; border-radius: 8px;
    font-size: .72rem; box-shadow: 0 8px 24px rgba(0,0,0,.45); backdrop-filter: blur(3px); }
  #exif-head { display: flex; align-items: center; gap: .4rem; padding: .35rem .55rem;
    cursor: pointer; user-select: none; font-weight: 700; letter-spacing: .03em;
    color: #c7ccd6; border-bottom: 1px solid #2b2d35; }
  #exif-head .tw { color: #6b6f79; font-weight: 600; }
  #exif-head .ct { margin-left: auto; color: #6b6f79; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  #exif.collapsed #exif-head { border-bottom: none; }
  #exif.collapsed #exif-body, #exif.collapsed #exif-loc { display: none; }
  #exif-loc { padding: .4rem .55rem; border-bottom: 1px solid #2b2d35; }
  #exif-loc:empty { display: none; }
  #exif-loc a, #exif-loc span { color: #6ea8ff; text-decoration: none; }
  #exif-loc a:hover { text-decoration: underline; }
  #exif-body { max-height: 50vh; overflow: auto; }
  #exif-body table { width: 100%; border-collapse: collapse; }
  #exif-body td { padding: .14rem .55rem; vertical-align: top; border-top: 1px solid #1f2128;
    font-family: ui-monospace, monospace; }
  #exif-body td.k { color: #8b909b; white-space: nowrap; }
  #exif-body td.v { color: #d7dbe2; word-break: break-word; }
  #exif-body .empty { padding: .5rem .55rem; color: #6b6f79; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<div id="done">
  <div>
    <h1 id="done-title">All caught up 🎉</h1>
    <p id="done-text">No more photos to review.</p>
    <p><a href="/">← Back to folders</a></p>
  </div>
</div>
<div id="exif" class="collapsed">
  <div id="exif-head"><span class="tw" id="exif-arrow">▸</span> EXIF <span class="ct" id="exif-count"></span></div>
  <div id="exif-loc"></div>
  <div id="exif-body"></div>
</div>
<div id="bar">
  <span class="count" id="count">…</span>
  <span class="zoom" id="zoom">100%</span>
  <span class="name" id="name"></span>
  <span class="keys" id="keys"><b>G</b> good · <b>N</b> not good · <b>M</b> maybe · <b>U</b> undo ·
    <b>0</b> fit · <b>Space</b> +25% · <b>J</b> +100% · <b>K</b> −100% · <b>I</b> exif</span>
</div>

<script>
// Browse mode (/review?folder=<path>): flip through one folder with ←/→, no rating.
const BROWSE_FOLDER = new URLSearchParams(location.search).get('folder');
const BROWSE = BROWSE_FOLDER !== null;
const PRELOAD_AHEAD = 4;           // how many upcoming images to fetch+decode
const KEEP_BEHIND = BROWSE ? 2 : 1; // images behind kept around (for undo, or for stepping back)
const MIN_ZOOM = 100;              // 100% == fit-to-viewport; never go below fit
const MAX_ZOOM = 1000;
const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

const stage = document.getElementById('stage');
const countEl = document.getElementById('count');
const zoomEl = document.getElementById('zoom');
const nameEl = document.getElementById('name');
const flashEl = document.getElementById('flash');
const doneEl = document.getElementById('done');
const exifEl = document.getElementById('exif');
const exifArrow = document.getElementById('exif-arrow');
const exifCount = document.getElementById('exif-count');
const exifLoc = document.getElementById('exif-loc');
const exifBody = document.getElementById('exif-body');

let queue = [];        // photo entries {path, name, folder, url}
let index = 0;         // index of the currently displayed photo
let zoom = 100;        // 100% == fit-to-viewport
const cache = new Map(); // url -> HTMLImageElement (loaded & decoded)

function preload(i) {
  const item = queue[i];
  if (!item || cache.has(item.url)) return;
  const img = new Image();
  img.src = item.url;
  cache.set(item.url, img);
  // Force decode so the eventual paint is instant.
  if (img.decode) img.decode().catch(() => {});
}

function getImg(url) {
  let img = cache.get(url);
  if (!img) { img = new Image(); img.src = url; cache.set(url, img); }
  return img;
}

// Evict everything outside the live window around `index`. Decoded full-res
// images are huge (a 24MP photo is ~96 MB as RGBA regardless of JPEG size), so
// without this the cache grows unbounded and exhausts memory after a few dozen
// photos. Clearing `src` lets the browser release the decoded bitmap and cancel
// any in-flight load immediately, rather than waiting on GC.
function trimCache() {
  const live = new Set();
  for (let k = -KEEP_BEHIND; k <= PRELOAD_AHEAD; k++) {
    const item = queue[index + k];
    if (item) live.add(item.url);
  }
  for (const [url, img] of cache) {
    if (live.has(url)) continue;
    img.src = '';
    cache.delete(url);
  }
}

function applyZoom() {
  const img = stage.querySelector('img');
  if (!img) return;
  zoomEl.textContent = zoom + '%';
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const fit = Math.min(stage.clientWidth / nw, stage.clientHeight / nh);
  const scale = fit * (zoom / 100);

  // Record what fraction of the content sits at the viewport center, so we can
  // keep that same point centered after resizing (zoom toward the center).
  const fx = (stage.scrollLeft + stage.clientWidth / 2) / stage.scrollWidth;
  const fy = (stage.scrollTop + stage.clientHeight / 2) / stage.scrollHeight;

  img.style.width = (nw * scale) + 'px';
  img.style.height = (nh * scale) + 'px';

  // Reading scrollWidth/Height below forces layout with the new size applied.
  stage.scrollLeft = fx * stage.scrollWidth - stage.clientWidth / 2;
  stage.scrollTop = fy * stage.scrollHeight - stage.clientHeight / 2;
}

function setZoom(v) {
  zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, v));
  applyZoom();
}

function show() {
  if (index >= queue.length) { showDone(); return; }
  doneEl.classList.remove('show');
  const item = queue[index];
  const img = getImg(item.url);
  zoom = 100;
  const place = () => { applyZoom(); stage.scrollTo(0, 0); };
  stage.replaceChildren(img);
  if (img.complete && img.naturalWidth) place();
  else img.addEventListener('load', place, { once: true });
  countEl.textContent = BROWSE ? (index + 1) + ' / ' + queue.length
                               : (queue.length - index) + ' left';
  nameEl.textContent = item.folder + ' / ' + item.name;
  updateExif(item);
  for (let k = 1; k <= PRELOAD_AHEAD; k++) preload(index + k);
  if (BROWSE) for (let k = 1; k <= KEEP_BEHIND; k++) preload(index - k);
  trimCache();
}

function step(delta) {
  const next = Math.min(queue.length - 1, Math.max(0, index + delta));
  if (next === index) return;
  index = next;
  show();
}

function showDone() {
  stage.replaceChildren();
  countEl.textContent = BROWSE ? '0 / 0' : '0 left';
  nameEl.textContent = '';
  exifSeq++;
  exifBody.replaceChildren();
  exifCount.textContent = '';
  doneEl.classList.add('show');
}

// --- EXIF overlay ----------------------------------------------------------
let exifSeq = 0;   // bumped per photo so stale fetch responses are discarded

function setExifCollapsed(collapsed) {
  exifEl.classList.toggle('collapsed', collapsed);
  exifArrow.textContent = collapsed ? '▸' : '▾';
  try { localStorage.setItem('exifCollapsed', collapsed ? '1' : '0'); } catch (e) {}
}

function toggleExif() {
  setExifCollapsed(!exifEl.classList.contains('collapsed'));
}

function renderExif(data) {
  const keys = Object.keys(data).sort((a, b) => a.localeCompare(b));
  exifCount.textContent = keys.length ? keys.length + ' tags' : '';
  if (!keys.length) {
    exifBody.replaceChildren(Object.assign(document.createElement('div'),
      { className: 'empty', textContent: 'No EXIF data.' }));
    return;
  }
  const table = document.createElement('table');
  for (const k of keys) {
    let v = data[k];
    if (Array.isArray(v)) v = v.join(', ');
    else if (v && typeof v === 'object') v = JSON.stringify(v);
    const tr = document.createElement('tr');
    const tdk = document.createElement('td');
    tdk.className = 'k'; tdk.textContent = k;
    const tdv = document.createElement('td');
    tdv.className = 'v'; tdv.textContent = (v === null || v === undefined) ? '—' : String(v);
    tr.append(tdk, tdv);
    table.append(tr);
  }
  exifBody.replaceChildren(table);
}

function renderLocation(loc, coords) {
  exifLoc.replaceChildren();
  if (!coords) return;
  const label = '📍 ' + (loc || (coords.lat.toFixed(5) + ', ' + coords.lon.toFixed(5)));
  const a = document.createElement('a');
  a.textContent = label;
  a.href = 'https://www.openstreetmap.org/?mlat=' + coords.lat + '&mlon=' + coords.lon + '#map=15/' + coords.lat + '/' + coords.lon;
  a.target = '_blank';
  a.rel = 'noopener';
  exifLoc.append(a);
}

async function updateExif(item) {
  const seq = ++exifSeq;
  exifCount.textContent = '';
  exifLoc.replaceChildren();
  exifBody.replaceChildren(Object.assign(document.createElement('div'),
    { className: 'empty', textContent: 'Loading…' }));
  try {
    const res = await fetch('/api/exif?path=' + encodeURIComponent(item.path));
    const data = await res.json();
    if (seq !== exifSeq) return;   // a newer photo is already showing
    renderLocation(data.location, data.coords);
    renderExif(data.exif || {});
  } catch (e) {
    if (seq !== exifSeq) return;
    exifBody.replaceChildren(Object.assign(document.createElement('div'),
      { className: 'empty', textContent: 'Failed to load EXIF.' }));
  }
}

document.getElementById('exif-head').addEventListener('click', toggleExif);
try { setExifCollapsed(localStorage.getItem('exifCollapsed') !== '0'); }
catch (e) { setExifCollapsed(true); }

function flash(kind, text) {
  flashEl.className = kind;
  flashEl.textContent = text;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { flashEl.className = ''; }, 350);
}

async function rate(rating, label, kind) {
  if (index >= queue.length) return;
  const item = queue[index];
  flash(kind, label);
  index++;            // advance immediately for instant feel
  show();
  try {
    const res = await fetch('/api/rate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
      body: JSON.stringify({ path: item.path, rating }),
    });
    if (!res.ok) throw new Error(await res.text());
  } catch (e) {
    alert('Failed to move photo:\n' + e.message + '\n\nReloading queue.');
    await loadQueue();
  }
}

async function undo() {
  const res = await fetch('/api/undo', {
    method: 'POST', headers: { 'X-CSRFToken': csrftoken },
  });
  const data = await res.json();
  if (!data.ok) { flash('undo', 'nothing to undo'); return; }
  // Put the restored photo back at the current position and show it.
  cache.delete(data.photo.url);
  queue.splice(index, 0, data.photo);
  flash('undo', 'undo');
  show();
}

async function loadQueue() {
  const url = BROWSE ? '/api/photos?folder=' + encodeURIComponent(BROWSE_FOLDER) : '/api/photos';
  const res = await fetch(url);
  if (!res.ok) {
    queue = []; index = 0; cache.clear(); showDone();
    document.getElementById('done-text').textContent = 'Cannot open this folder.';
    return;
  }
  const data = await res.json();
  queue = data.photos;
  index = 0;
  cache.clear();
  show();
}

const SCROLL_STEP = 120;   // pixels per arrow press

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (BROWSE) {
    switch (e.key) {
      case 'ArrowLeft':  e.preventDefault(); step(-1); return;
      case 'ArrowRight': e.preventDefault(); step(1); return;
    }
  }
  switch (e.key) {
    case 'ArrowUp':    e.preventDefault(); stage.scrollBy(0, -SCROLL_STEP); return;
    case 'ArrowDown':  e.preventDefault(); stage.scrollBy(0,  SCROLL_STEP); return;
    case 'ArrowLeft':  e.preventDefault(); stage.scrollBy(-SCROLL_STEP, 0); return;
    case 'ArrowRight': e.preventDefault(); stage.scrollBy( SCROLL_STEP, 0); return;
  }
  if (!BROWSE) {
    switch (e.key.toLowerCase()) {
      case 'g': e.preventDefault(); rate('good', 'GOOD', 'good'); return;
      case 'n': e.preventDefault(); rate('not_good', 'NOT GOOD', 'not_good'); return;
      case 'm': e.preventDefault(); rate('maybe', 'MAYBE', 'maybe'); return;
      case 'u': e.preventDefault(); undo(); return;
    }
  }
  switch (e.key.toLowerCase()) {
    case '0': e.preventDefault(); setZoom(100); break;
    case ' ': e.preventDefault(); setZoom(zoom + 25); break;
    case 'j': e.preventDefault(); setZoom(zoom + 100); break;
    case 'k': e.preventDefault(); setZoom(zoom - 100); break;
    case 'i': e.preventDefault(); toggleExif(); break;
  }
});

if (BROWSE) {
  document.title = 'Browse';
  document.getElementById('done-title').textContent = 'Empty folder';
  document.getElementById('done-text').textContent = 'No photos in this folder.';
  document.getElementById('keys').innerHTML = '<b>←</b> prev · <b>→</b> next · ' +
    '<b>0</b> fit · <b>Space</b> +25% · <b>J</b> +100% · <b>K</b> −100% · <b>I</b> exif';
}

window.addEventListener('resize', applyZoom);
loadQueue();
</script>
</body>
</html>
